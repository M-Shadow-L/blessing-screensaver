<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>给你的一封小情书</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #ffe2ec, #fff4d8);
      color: #704653;
    }

    .card {
      width: min(90vw, 430px);
      padding: 42px 28px;
      text-align: center;
      border-radius: 28px;
      background: rgba(255, 255, 255, .86);
      box-shadow: 0 18px 55px rgba(180, 95, 125, .18);
      position: relative;
      z-index: 1;
    }

    .heart {
      font-size: 58px;
      animation: beat 1s infinite;
    }

    h1 { margin: 14px 0; color: #e66c91; }
    p { line-height: 1.9; }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 25px;
      margin: 10px 6px 0;
      font-size: 16px;
      cursor: pointer;
      transition: transform .2s;
    }

    button:hover { transform: translateY(-3px); }

    #yes {
      color: white;
      background: #ed7c9e;
      box-shadow: 0 7px 18px rgba(237, 124, 158, .3);
    }

    #no {
      color: #8c6872;
      background: #f5e9ec;
    }

    .float-heart {
      position: fixed;
      bottom: -30px;
      color: #f08eaa;
      animation: floatUp 5s linear forwards;
      pointer-events: none;
    }

    @keyframes beat {
      50% { transform: scale(1.16); }
    }

    @keyframes floatUp {
      to { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">💗</div>
    <h1>有句话想对你说</h1>
    <p>
      遇见你之后，平凡的日子也变得闪闪发光。<br />
      我喜欢你的笑容，也喜欢和你在一起的每一刻。<br />
      <strong>你愿意和我在一起吗？</strong>
    </p>
    <button id="yes">我愿意 💕</button>
    <button id="no">让我想想</button>
  </main>

  <script>
    const noButton = document.querySelector("#no");

    noButton.addEventListener("click", () => {
      noButton.textContent = "再考虑一下嘛～";
    });

    document.querySelector("#yes").addEventListener("click", () => {
      document.querySelector("h1").textContent = "太好啦！💖";
      document.querySelector("p").innerHTML =
        "从今天开始，一起制造更多快乐的回忆吧！<br /><strong>喜欢你，真的很喜欢你。</strong>";
      document.querySelector("#yes").textContent = "我们在一起啦 ✨";
      noButton.remove();
    });

    function makeHeart() {
      const heart = document.createElement("span");
      heart.className = "float-heart";
      heart.textContent = Math.random() > 0.5 ? "♥" : "♡";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = 14 + Math.random() * 22 + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 5000);
    }

    setInterval(makeHeart, 450);
  </script>
</body>
</html>
